<aside class="rounded-2xl border border-rose-500/30 bg-rose-500/5 p-5">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-rose-300">Audit moteur V0.5.1</p>
  <h2 class="mt-2 text-xl font-bold">Prédictions trop uniformes : problème confirmé</h2>
  <p class="mt-3 text-sm leading-6 text-slate-300">{{ audit.engineWarning }}</p>
  <div class="mt-4 flex flex-wrap gap-2 text-xs">
    <span class="rounded-full bg-slate-900 px-3 py-1">Baseline 1-1 : {{ audit.oneOneRateBaseline | percent: '1.0-0' }}</span>
    <span class="rounded-full bg-slate-900 px-3 py-1">Elo 1-1 : {{ audit.oneOneRateElo | percent: '1.0-0' }}</span>
    <span class="rounded-full bg-slate-900 px-3 py-1">Top scores changés : {{ audit.topScoreChangedCount }}/{{ audit.totalMatches }}</span>
  </div>
</aside>
