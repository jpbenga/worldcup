<section>
  <div class="mb-4">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-emerald-300">Depuis la matrice</p>
    <h3 class="mt-1 text-lg font-semibold">Marchés déduits</h3>
  </div>

  <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
    @for (item of items; track item.label) {
      <article
        class="rounded-xl border p-4"
        [class.border-emerald-500/30]="item.highlight"
        [class.bg-emerald-500/10]="item.highlight"
        [class.border-slate-800]="!item.highlight"
        [class.bg-slate-900/70]="!item.highlight"
      >
        <p class="text-sm text-slate-400">{{ item.label }}</p>
        <p class="mt-2 text-2xl font-bold" [class.text-emerald-300]="item.highlight">
          {{ item.value | percent: '1.1-1' }}
        </p>
      </article>
    }
  </div>
</section>
