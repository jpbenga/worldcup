<section class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70 shadow">
  <header class="border-b border-slate-800 px-5 py-4">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-300">Top 10</p>
    <h3 class="mt-1 text-lg font-semibold">Matrice de scores</h3>
  </header>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-950/60 text-xs uppercase tracking-wider text-slate-500">
        <tr>
          <th class="px-5 py-3 font-medium">Score</th>
          <th class="px-5 py-3 text-right font-medium">Probabilité</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800">
        @for (score of leadingScores; track score.score) {
          <tr class="transition hover:bg-slate-800/40">
            <td class="px-5 py-3 font-semibold text-slate-100">{{ score.score }}</td>
            <td class="px-5 py-3 text-right text-cyan-300">
              {{ score.probability | percent: '1.1-1' }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
